# =============================================================================
# Capo — Logfire alert rules (spec §11.3 monitoring table + §6.5 span taxonomy)
#
# This file is a DECLARATIVE catalogue of the alerts an operator should apply to
# their Logfire project via the Logfire MCP `alert_create` tool. It is NOT
# automatically applied at Capo boot — Capo is observability-out-only and does
# not own a Logfire control-plane token.
#
# Each entry maps 1:1 to a `mcp__logfire__alert_create` invocation:
#
#   alert_create(
#       name=<id>,
#       query=<query>,
#       time_window=<time_window>,         # e.g. "5m", "15m", "1h"
#       notification_mode=<notification_mode>,
#       channel_ids=[<resolved channel id from channel_list>],
#   )
#
# Operator workflow:
#   1. Create notification channels once via `mcp__logfire__channel_create`
#      (Slack incoming webhook recommended for V1 — see logfire-alerts.md).
#   2. Resolve channel IDs via `mcp__logfire__channel_list`.
#   3. For each alert below, call `mcp__logfire__alert_create` with the
#      `query`, `time_window`, and `notification_mode` from this file plus
#      the resolved channel id(s) matching the `channels:` list.
#
# Span taxonomy reference (spec §6.5, enforced by Task #51 / capo/observability.py):
#
#   - capo.boot                              process boot
#   - capo.amc.webhook.in                    inbound webhook
#   - capo.dispatcher.handle                 per-channel worker turn
#   - capo.agent.run                         Pydantic AI run
#   - capo.tool.<name>                       tool execution
#   - capo.delegation.<agent>.spawn          subprocess spawn
#   - capo.delegation.<agent>.monitor        DBOS workflow body
#   - capo.delegation.<agent>.complete       completion step
#       attrs: delegation_id, agent, runtime_s, cost_usd,
#              status ∈ {completed, failed, killed}
#   - capo.amc.send                          outbound AMC REST
#       attrs: channel_id, idempotency_key, error_code (e.g. PLATFORM_AUTH,
#              INTERNAL_ERROR, CHANNEL_NOT_FOUND, ATTACHMENT_TOO_LARGE,
#              VALIDATION_ERROR, RATE_LIMITED)
#   - capo.memory.compact                    compaction event
#   - capo.budget.cap                        soft/hard cap hit
#       attrs: cap_kind ∈ {soft, hard, override}, usd_today, usd_limit
#   - capo.approval.request / .resolve       approval lifecycle
#
# FastAPI routes (instrument_fastapi_app) appear in the same `records` table
# with attribute `http.route = '/healthz'` and `http.status_code = NNN`.
#
# SQL dialect: Apache DataFusion (Postgres-like). JSON access via `->>`.
# All queries select from `records` (the unified span+log table) and include a
# `LIMIT` to stay within the alert query budget.
#
# Pre-launch behavior: if no telemetry has been ingested yet, every query
# below returns zero rows and the alert silently no-ops — the alert engine
# treats "no rows" as "no problem". No special-casing needed.
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# Notification channels (declarative — operator creates these once and resolves
# IDs via `channel_list`; the `channels:` field on each alert references these
# logical names, NOT the resolved channel IDs).
# -----------------------------------------------------------------------------
channels:
  - name: ops_primary
    description: |
      Primary on-call destination for Capo operational alerts. Slack incoming
      webhook recommended (see internal/ops/logfire-alerts.md → "Channel setup").
      An AMC `notify_channel` can be substituted by pointing the Slack webhook
      URL at an AMC inbound bridge, but the §11.3 table prescribes Slack-style
      delivery first.
    type: slack
    # webhook_url:  resolved at apply time (operator secret)

  - name: ops_secondary
    description: |
      Secondary destination for lower-severity / informational alerts (e.g.
      cost-cap notifications). May be the same channel as ops_primary in V1.
    type: slack

# -----------------------------------------------------------------------------
# Alerts (one entry per §11.3 monitoring-table row, expanded to match the
# acceptance criteria of Task #60).
#
# Severities (operator-side labelling — Logfire alerts do not natively carry a
# severity field, but the message body and channel routing encode it):
#   - critical : page immediately
#   - high     : page during business hours, ack within 1h
#   - medium   : triage within the day
#
# `notification_mode` options (per Logfire alerts API):
#   - any_results            : notify every run that returns rows
#   - results_change         : notify when the row set changes
#   - starts_having_results  : notify on transition empty → non-empty
#   - starts_or_stops        : notify on either transition
#
# `any_results` is the safest default for rate/threshold alerts — duplicate
# notifications are acceptable; missed transitions are not.
# -----------------------------------------------------------------------------
alerts:

  # -----------------------------------------------------------------------------
  # §11.3 row: Delegation failure rate > 25% over 1h
  # AC §60: Alert: delegation.failed rate > 0 per hour → high severity.
  #
  # Implementation: count delegations that completed with status='failed' in the
  # last hour. The §11.3 spec calls out > 25% as the threshold but the §60
  # acceptance criterion tightens this to "> 0 per hour" — we honour the
  # stricter AC #60 wording and surface the count so an operator can re-tune
  # via the dashboard.
  # -----------------------------------------------------------------------------
  - name: capo_delegation_failures_hourly
    severity: high
    description: |
      Any subagent delegation reached terminal status `failed` in the last hour.
      Source span: `capo.delegation.<agent>.complete` with attribute
      `status='failed'`. `<agent>` is `claude_code` or `codex`.
    time_window: 1h
    notification_mode: any_results
    channels: [ops_primary]
    query: |
      SELECT
          trace_id,
          span_name,
          attributes->>'delegation_id' AS delegation_id,
          attributes->>'agent'         AS agent,
          attributes->>'status'        AS status,
          attributes->>'runtime_s'     AS runtime_s,
          attributes->>'cost_usd'      AS cost_usd,
          start_timestamp
      FROM records
      WHERE
          span_name LIKE 'capo.delegation.%.complete'
          AND attributes->>'status' = 'failed'
          AND start_timestamp > now() - INTERVAL '1 hour'
      ORDER BY start_timestamp DESC
      LIMIT 100

  # -----------------------------------------------------------------------------
  # §11.3 row: AMC `send` 5xx rate > 10% over 15m
  # AC §60: Alert: amc.send.errors with code in {PLATFORM_AUTH, INTERNAL_ERROR}
  #         > 0 per 15min → high.
  #
  # The §6.5 span `capo.amc.send` carries `error_code` (one of PLATFORM_AUTH,
  # INTERNAL_ERROR, CHANNEL_NOT_FOUND, ATTACHMENT_TOO_LARGE, VALIDATION_ERROR,
  # RATE_LIMITED, UNKNOWN). We page on the two most actionable codes per AC §60.
  # -----------------------------------------------------------------------------
  - name: capo_amc_send_errors_15m
    severity: high
    description: |
      One or more `capo.amc.send` spans surfaced a PLATFORM_AUTH or
      INTERNAL_ERROR code in the last 15 minutes. PLATFORM_AUTH means the AMC
      bearer is rejected (NEVER retried — fix bearer + restart Capo).
      INTERNAL_ERROR means AMC returned a 5xx (transient; retried once by the
      `capo.transport.amc_client` retry layer, but persistent occurrences
      indicate AMC is unhealthy).
    time_window: 15m
    notification_mode: any_results
    channels: [ops_primary]
    query: |
      SELECT
          trace_id,
          attributes->>'channel_id'      AS channel_id,
          attributes->>'idempotency_key' AS idempotency_key,
          attributes->>'error_code'      AS error_code,
          start_timestamp
      FROM records
      WHERE
          span_name = 'capo.amc.send'
          AND attributes->>'error_code' IN ('PLATFORM_AUTH', 'INTERNAL_ERROR')
          AND start_timestamp > now() - INTERVAL '15 minutes'
      ORDER BY start_timestamp DESC
      LIMIT 100

  # -----------------------------------------------------------------------------
  # AC §60: Alert: approval workflow exceptions > 0 per 15min → medium.
  #
  # The `capo.approval.request` span covers the entire DBOS request→decision
  # body. An exception inside the workflow surfaces as `is_exception = true`
  # on the span.
  # -----------------------------------------------------------------------------
  - name: capo_approval_workflow_exceptions_15m
    severity: medium
    description: |
      DBOS approval workflow body raised an exception in the last 15 minutes.
      Source span: `capo.approval.request`. An exception here typically means a
      bug in the gating logic — the user-facing notification path
      (`notify_approval`) handles AMC outages idempotently and should not
      surface here.
    time_window: 15m
    notification_mode: any_results
    channels: [ops_primary]
    query: |
      SELECT
          trace_id,
          attributes->>'approval_id'  AS approval_id,
          attributes->>'action_kind'  AS action_kind,
          exception_type,
          exception_message,
          start_timestamp
      FROM records
      WHERE
          span_name = 'capo.approval.request'
          AND is_exception = true
          AND start_timestamp > now() - INTERVAL '15 minutes'
      ORDER BY start_timestamp DESC
      LIMIT 100

  # -----------------------------------------------------------------------------
  # §11.3 row: DBOS workflow failures > 3 in 1h
  # AC §60: Alert: DBOS workflow exceptions > 0 per 15min → high.
  #
  # Honouring the tighter AC #60 wording. Covers BOTH delegation and approval
  # workflow bodies — the union of `capo.delegation.*.monitor` and
  # `capo.approval.request`.
  # -----------------------------------------------------------------------------
  - name: capo_dbos_workflow_exceptions_15m
    severity: high
    description: |
      One or more DBOS workflow spans (delegation monitor or approval request)
      surfaced an exception in the last 15 minutes. Persistent occurrences
      indicate a workflow-body bug or a downstream subsystem failure.
    time_window: 15m
    notification_mode: any_results
    channels: [ops_primary]
    query: |
      SELECT
          trace_id,
          span_name,
          attributes->>'delegation_id' AS delegation_id,
          attributes->>'approval_id'   AS approval_id,
          attributes->>'step_name'     AS step_name,
          exception_type,
          exception_message,
          start_timestamp
      FROM records
      WHERE
          (span_name LIKE 'capo.delegation.%.monitor'
           OR span_name = 'capo.approval.request')
          AND is_exception = true
          AND start_timestamp > now() - INTERVAL '15 minutes'
      ORDER BY start_timestamp DESC
      LIMIT 100

  # -----------------------------------------------------------------------------
  # §11.3 row: Daily cost approaching soft cap (at 75% of soft cap)
  # AC §60: Alert: cost daily_total crosses hard cap → critical (informational;
  #         the budget hook is the gate).
  #
  # The `capo.budget.cap` span (Task #49) is opened by the pre-tool-call budget
  # hook with `cap_kind ∈ {soft, hard, override}`. AC #60 specifically wants the
  # hard-cap crossing — this is informational (the hook itself blocks the
  # turn). We also include a separate informational alert at the §11.3
  # 75%-of-soft threshold for early warning.
  # -----------------------------------------------------------------------------
  - name: capo_budget_hard_cap_reached
    severity: critical
    description: |
      Daily cost crossed the hard cap. Informational only — the
      `capo.transport.dispatcher` pre-agent budget hook (Task #49) blocks the
      offending turn and replies with the cap-reached message. The alert
      exists so the operator sees the event in Slack and can decide whether
      to `/override` (one-turn bypass) or raise the cap.
    time_window: 15m
    notification_mode: any_results
    channels: [ops_primary]
    query: |
      SELECT
          trace_id,
          attributes->>'cap_kind'  AS cap_kind,
          attributes->>'usd_today' AS usd_today,
          attributes->>'usd_limit' AS usd_limit,
          start_timestamp
      FROM records
      WHERE
          span_name = 'capo.budget.cap'
          AND attributes->>'cap_kind' = 'hard'
          AND start_timestamp > now() - INTERVAL '15 minutes'
      ORDER BY start_timestamp DESC
      LIMIT 100

  - name: capo_budget_soft_cap_early_warning
    severity: medium
    description: |
      Daily cost crossed the soft cap. Per §11.3 the original threshold is 75%
      of the soft cap; we currently page on the soft-cap span itself (which
      the budget hook fires at 100% of soft). Tighten to 75% by adding a
      `usd_today / usd_limit > 0.75` predicate once the operator has dialled in
      the soft cap. Informational — the hook does NOT block on soft.
    time_window: 1h
    notification_mode: any_results
    channels: [ops_secondary]
    query: |
      SELECT
          trace_id,
          attributes->>'cap_kind'  AS cap_kind,
          attributes->>'usd_today' AS usd_today,
          attributes->>'usd_limit' AS usd_limit,
          start_timestamp
      FROM records
      WHERE
          span_name = 'capo.budget.cap'
          AND attributes->>'cap_kind' = 'soft'
          AND start_timestamp > now() - INTERVAL '1 hour'
      ORDER BY start_timestamp DESC
      LIMIT 100

  # -----------------------------------------------------------------------------
  # AC §60: Alert: /healthz failures > 0 per 5min → critical.
  #
  # FastAPI is instrumented by `logfire.instrument_fastapi_app(app)` so every
  # request appears in `records` with `attributes->>'http.route' = '/healthz'`
  # and `attributes->>'http.status_code'` set. The healthz handler returns
  # 503 when ANY critical probe fails (see capo/transport/health.py).
  # -----------------------------------------------------------------------------
  - name: capo_healthz_failures_5m
    severity: critical
    description: |
      One or more `/healthz` requests returned a non-2xx status in the last
      5 minutes. 503 means at least one critical subsystem probe failed
      (state_db, dbos_db, dbos_launched, amc_reachable — see
      `capo/transport/health.py::CRITICAL_PROBES`). Any 5xx here demands
      immediate triage — the launchd `KeepAlive` will not restart Capo on a
      probe failure (it only restarts on process exit).
    time_window: 5m
    notification_mode: any_results
    channels: [ops_primary]
    query: |
      SELECT
          trace_id,
          attributes->>'http.route'        AS route,
          attributes->>'http.status_code'  AS status_code,
          start_timestamp
      FROM records
      WHERE
          attributes->>'http.route' = '/healthz'
          AND CAST(attributes->>'http.status_code' AS BIGINT) >= 500
          AND start_timestamp > now() - INTERVAL '5 minutes'
      ORDER BY start_timestamp DESC
      LIMIT 100

  # -----------------------------------------------------------------------------
  # §11.3 row: Webhook signature failures > 5 in 5m (possible attack)
  #
  # Not explicitly listed in AC §60 but called out by §11.3. The
  # `capo.amc.webhook.in` span carries `signature_ok` (bool); a flood of
  # signature_ok=false indicates either a misconfigured AMC or a probe.
  # -----------------------------------------------------------------------------
  - name: capo_webhook_signature_failures_5m
    severity: high
    description: |
      More than 5 inbound webhook envelopes failed HMAC signature verification
      in the last 5 minutes. Either AMC's shared secret rotated and Capo's
      `.env` is stale, or an unauthenticated caller is probing the loopback
      listener. Verify `capo.transport.amc_listener` settings.
    time_window: 5m
    notification_mode: any_results
    channels: [ops_primary]
    query: |
      SELECT
          COUNT(*) AS failure_count
      FROM records
      WHERE
          span_name = 'capo.amc.webhook.in'
          AND attributes->>'signature_ok' = 'false'
          AND start_timestamp > now() - INTERVAL '5 minutes'
      HAVING COUNT(*) > 5
      LIMIT 1

  # -----------------------------------------------------------------------------
  # §11.3 row: Listener handler P99 latency > 2s for 5m
  #
  # Informational — surfaces sustained slowness in the inbound webhook path.
  # Logfire DataFusion supports `approx_percentile_cont`.
  # -----------------------------------------------------------------------------
  - name: capo_webhook_p99_latency_5m
    severity: medium
    description: |
      P99 latency of the inbound webhook handler exceeded 2 seconds over the
      last 5 minutes. The handler is supposed to be a fast-ACK (sub-100ms
      typically). Sustained slowness indicates the fast-ACK path is being
      blocked by synchronous work.
    time_window: 5m
    notification_mode: any_results
    channels: [ops_secondary]
    query: |
      SELECT
          approx_percentile_cont(duration, 0.99) AS p99_seconds
      FROM records
      WHERE
          span_name = 'capo.amc.webhook.in'
          AND start_timestamp > now() - INTERVAL '5 minutes'
      HAVING approx_percentile_cont(duration, 0.99) > 2.0
      LIMIT 1
