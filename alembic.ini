# Alembic config — Capo `state.db` schema migrations.
#
# This file targets ONLY the application schema (`state.db`). DBOS owns its own
# `dbos.db` and migrates it internally.
#
# The runtime database URL is resolved by ``migrations/env.py`` in this order:
#   1. ``-x dburl=sqlite:///...`` passed on the alembic CLI.
#   2. ``CAPO_STATE_DB`` environment variable (path-like or full URL).
#   3. ``sqlalchemy.url`` from this file (placeholder fallback below).
#
# The default below points at an in-tree sandbox path; production deployments
# should always supply ``CAPO_STATE_DB`` or ``-x dburl=...``.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = sqlite:///./state.db

# Do not auto-truncate slugs in version filenames; we hand-name `001_init.py`.
truncate_slug_length = 40

# We don't use timezone-aware revision timestamps in V1.
# timezone =

[post_write_hooks]
# Hook placeholder; left empty intentionally.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
