[project]
name = "capo"
version = "0.1.0"
description = "Capo: a routing agent that delegates to Claude Code and Codex via AMC."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Stephen Sequenzia" },
]
license = { text = "Proprietary" }

# Pinned core dependencies (see internal/specs/capo-SPEC.md §9.1, §12).
# Versions resolved 2026-05-10; pin for reproducibility.
dependencies = [
    "pydantic-ai==1.93.0",
    "fastapi==0.136.1",
    "dbos==2.21.0",
    "pydantic-settings==2.14.1",
    "httpx==0.28.1",
    "alembic==1.18.4",
    "logfire==4.32.1",
    "sqlalchemy==2.0.49",
    "uvicorn==0.46.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.12",
]

[project.scripts]
capo = "capo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capo"]

# ---------------------------------------------------------------------------
# Ruff configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "internal",
    "scripts",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

